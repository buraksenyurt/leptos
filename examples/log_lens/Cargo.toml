[package]
name = "log_lens"
version = "0.1.0"
edition = "2021"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"

[dependencies]
leptos = { path = "../../leptos", features = ["csr"] }
console_error_panic_hook = "0.1.7"
gloo-timers = { version = "0.4.0", features = ["futures"] }
js-sys = "0.3.70"
memchr = "2.7"
rustc-hash = "2.1"
wasm-bindgen = "0.2.93"
wasm-bindgen-futures = "0.4.43"
web-sys = { version = "0.3.70", features = [
  "Blob",
  "DataTransfer",
  "DragEvent",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "HtmlInputElement",
  "Navigator",
  "Performance",
  "Storage",
] }
